<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Soccer Scorecard</title>
    <link rel="stylesheet" type="text/css" href="../CSS/scorecard-stylesheet.css">
    <style>
      table {
        width: 600px;
        height: 150px;
      }
      tr:first-child td:first-child {
        border: none;
      }
    </style>
  </head>
  <body>
    <h4>Cassandra McCaughey/ Scorecards Assignment/ Soccer Scorecard</h4>
    <hr/>
    <br/>
    <table>
      <caption>Soccer Scorecard</caption>
      <tr>
        <td style="visibility: hidden;"></td>
        <th>Team A</th>
        <th>Team B</th>
      </tr>
      <tr>
        <td>1st Half Goals</td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td>2nd Half Goals</td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td>Winner:</td>
        <td colspan="2">(Team name)</td>
      </tr>
    </table>
  </body>
</html>
