<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Review Cards Assignment</title>
   <!-- <link rel="stylesheet" type="text/css" href="CSS/review-cards-stylesheet.css"> -->
    <style>
      @font-face {
        font-family: 'ChineseFont';
        src: url('Documents/Chinese-font.ttf') format('truetype');
        font-weight: normal;
      }
      body {
        background-color: #dedaf1;
        font-family: 'ChineseFont', Arial, sans-serif;
      }
      h1 {
        color: #171d33;
        font-family: 'ChineseFont', Arial, sans-serif;
      }
      div.container {
        display: flex;
        flex-direction: column;
        margin-left: 300px;
      }
      div.q {
        position: relative;
        height: 600px;
      }
      h4 {
        position: absolute;
        top: 0;
        left: 0;
        font-size: 3em;
      }
      h4.term {
        background-color: #253d81;
        width: 500px;
        height: 300px;
        z-index: 2;
      }
      div.definition {
        background-color: white;
        transition: margin-left 2s;
        transition-timing-function: ease;
        z-index: 1;
        width: 600px;
        height: 300px;
      }
      h4.definition {
        color: black;
      }
      div.definition:hover {
        margin-left: 200px;
      }
    </style>
  </head>
  <body>
    <h1>Review Cards</h1>
    <div class="container">
      <div class="q">
        <h4 class="term">
          nihao 你好
        </h4>
        <div class="definition">
          <h4 class="definiton">
            hello
          </h4>
        </div>
      </div><!--end of question 1-->
      <div class="q">
        <h4 class="term">
          zaijian 再见
        </h4>
        <h4 class="definiton">
          goodbye/ see you
        </h4>
      </div><!--end of question 2-->
    </div>
  </body>
</html>
