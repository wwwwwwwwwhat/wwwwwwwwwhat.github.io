<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Review Cards Assignment</title>
   <!-- <link rel="stylesheet" type="text/css" href="CSS/review-cards-stylesheet.css"> -->
    <style>
      @font-face {
        font-family: 'ChineseFont';
        src: url('Documents/Chinese-font.ttf') format('truetype');
        font-weight: normal;
      }
      body {
        background-color: #dedaf1;
        font-family: 'ChineseFont', Arial, sans-serif;
        font-size: 1.5em;
      }
      h1 {
        color: #171d33;
        font-size: 3em;
      }
      div {
        margin: 0px;
      }
      div.container {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        margin-left: 200px;
        background-color: green;
        gap:15px;
      }
      div.q {
        height: 400px;
        background-color: red;
        position: relative;
      }
      h4 {
        font-size: 3em;
        position: absolute;
        bottom: 5px;
        left: 5px;
        display: flex;
        width: 500px;
        height: 300px;
        text-align: center;
        align-items: center;
      }
      h4.term {
        color: #171d33;
        background-color: white;
        z-index: 2;
        border: 3px solid #253d81;
        transition: transform 3s;
        transition-timing-function: ease;
      }
      h4.term:hover {
        transform: translate(30px 30px);
      }
      h4.definition {
        color: #efedfa;
        background-color: #7549b6;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <h1>Review Cards</h1>
    <div class="container">
      <div class="q">
        <h4 class="term">
          你好
        </h4>
        <h4 class="definiton">
          hello
        </h4>
      </div><!--end of question 1-->
      <div class="q">
        <h4 class="term">
          zaijian 再见
        </h4>
        <div class="definition">
          <h4 class="definiton">
            goodbye/ see you
          </h4>
        <div class="definition">
      </div><!--end of question 2-->
    </div>
  </body>
</html>
