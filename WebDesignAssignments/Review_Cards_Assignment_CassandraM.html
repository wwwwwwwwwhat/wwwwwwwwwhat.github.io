<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Review Cards Assignment</title>
    <style>
      @font-face {
        font-family: 'ChineseFont';
        src: url('Documents/Chinese-font.ttf') format('truetype');
        font-weight: normal;
      }
      @keyframes slideup {
        from {
          opacity: 0;
          transform: translateY(800px);
        }
        to {
          opacity: 100;
        }
      }
      body {
        background-color: #dedaf1;
        font-family: 'ChineseFont', Arial, sans-serif;
      }
      h1 {
        color: #171d33;
        font-size: 3em;
      }
      .container {
        display: flex;
        flex-direction: row;
        margin-left: 70px;
        gap:15px;
        flex-wrap: wrap;
        justify-content: flex-start;
        animation-name: slideup;
        animation-duration: 4s;
      }
      .q {
        height: 160px;
        width: 600px;
        position: relative;
        display: flex;
        flex-direction: row;
      }
      h4 {
        font-size: 3em;
        position: absolute;
        top: 5px;
        left: 5px;
        display: flex;
        width: 300px;
        height: 150px;
        align-items: center;
        justify-content:center;
      }
      h4.term {
        color: #171d33;
        background-color: white;
        z-index: 2;
        border: 3px solid #253d81;
        transition: margin-left 2s;
        transition-timing-function: ease;
      }
      h4.term:hover {
        margin-left: 280px;
      }
      h4.definition {
        color: #efedfa;
        background-image: linear-gradient(to right, #7549b6, #253d81);
        z-index: 1;
      }
      h3.pink {
        color: #f26d84;
        position: absolute;
        right:0px
        top: 20px;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <h1>Review Cards</h1>
    <div class="container">
      <div class="q">
        <h4 class="term">
          你好
        </h4>
        <h4 class="definition">
          hello
        </h4>
        <h3 class="pink">
          hover over card to reveal definition
        </h3>
      </div><!--end of question 1-->
      <div class="q">
        <h4 class="term">
          再见
        </h4>
        <h4 class="definition">
          goodbye
        </h4>
      </div><!--end of question 2-->
      <div class="q">
        <h4 class="term">
          家
        </h4>
        <h4 class="definition">
          home
        </h4>
      </div><!--end of question 3-->
      <div class="q">
        <h4 class="term">
          学校
        </h4>
        <h4 class="definition">
          school
        </h4>
      </div><!--end of question 4-->
      <div class="q">
        <h4 class="term">
          猫
        </h4>
        <h4 class="definition">
          cat
        </h4>
      </div><!--end of question 5-->
      <div class="q">
        <h4 class="term">
          狗
        </h4>
        <h4 class="definition">
          dog
        </h4>
      </div><!--end of question 6-->
      <div class="q">
        <h4 class="term">
          爸爸
        </h4>
        <h4 class="definition">
          dad
        </h4>
      </div><!--end of question 7-->
      <div class="q">
        <h4 class="term">
          妈妈
        </h4>
        <h4 class="definition">
          mom
        </h4>
      </div><!--end of question 8-->
    </div><!--end of container div-->
  </body>
</html>
<!--cute hot pink #f26d84, webdesignpurple #253d81, dark purp #412ea2-->
