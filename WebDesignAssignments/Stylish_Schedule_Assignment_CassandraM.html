<head>
  <title>Stylish Schedule Assignment</title>
</head>

<body>
  <h4>Cassandra McCaughey/ Stylish Schedule Assignment</h4>
<hr/>
<br/> 
  
<style>
  table {
    width: 600px;
    margin: auto;
    color: #0b8a21;
    background-color: #80fa7a;
    font-size: 20px;
    font-family: Arial, sans-serif;
    border-collapse: collapse;
  }
  th {
    border: 3px solid #0b8a21;
  }
  .time {
    border: 3px solid #ob8a21;
  }
  td {
    padding: 10px;
  }
  tr.red {
    background-color: #ffa58f;
    color: #850708;  
   }
</style>

<body>
  <table>
    <caption>Friday, Dec 25</caption>
    <tr>
      <th colspan="2">Christmas Plan</th>
    </tr>
    <colgroup>
      <col class="time">
      <col span="11">
    </colgroup>
    <tr class="red">
      <td>9:30 AM</td>
      <td>Wake up</td>
    </tr>
    <tr>
      <td>10:00 AM</td>
      <td>Check stockings</td>
    </tr>
    <tr class="red">
      <td>10:20</td>
      <td>Pancake Breakfast</td>
    </tr>
    <tr>
      <td>11 AM</td>
      <td>Open gifts!</td>
    </tr>
    <tr class="red">
      <td>1 PM</td>
      <td>Photo on the stairs</td>
    </tr>
    <tr>
      <td>4 PM</td>
      <td>Family arrives</td>
    </tr>
    <tr class="red">
      <td>4:30 PM</td>
      <td>Gingerbread Houses!</td>
    </tr>
    <tr>
      <td>6:30 PM</td>
      <td>Dinner</td>
    </tr>
    <tr class="red">
      <td>8 PM</td>
      <td>Goodbyes</td>
    </tr>
     <tr>
      <td>9 PM</td>
      <td>Spooky Movie</td>
    </tr>
    <tr class="red">
      <td>11 PM</td>
      <td>Bedtime</td>
    </tr>
  </table>
</body>
