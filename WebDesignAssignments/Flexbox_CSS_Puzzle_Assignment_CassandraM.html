<style>
  section.grid-container {
    display: grid;
    width: 600px;
    height: 500px;
    grid-template-columns: 3fr 2fr 1fr;
    grid-template-rows: 1fr 7fr;
    padding: 10px;
  }
  div {
    border: 3px solid black;
    padding: 10px;
    text-align: center;
    font-size: 20px;
  }
  .puzzlebox {
    grid-column-start: auto;
    grid-column-end: span 6;
  }
  .flexbox {
    display: flex;
    gap: 0px;
    align-items: flex-start;
    flex-direction: row;
    flex-wrap: wrap;
  }
  img {
    width: 25%;
  }
  .A {

  }

  .I {

  }
  .J {

  }
  .K {

  .L {
    order:15;
  }
  .M {
    order:5;
  }
  .N {
    order:11;
  }
  .O {
    order:9;
  }
  .P {
    order:6;
  }
  .Q {
    order:1;
  }
</style>
