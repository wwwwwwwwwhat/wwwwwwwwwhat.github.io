    <style>
      div.head {
        width: 100%;
        height: 300px;
        background-color: blue;
        margin: 0px;
      }
      div.fnav {
        width: 100%;
        height: 200px;
        background-color: #aecbd9;
        margin: 0px;
      }
      div.book {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0px;
      }
      /*Table styling*/
      table {
        display: block;
        width: auto;
        height: auto;
        background-color: white;
        padding: 0px;
        border-collapse: collapse;
        border-radius: 10px 0px 0px 10px;
      }
      th {
        height: 15px;
        border-bottom: 4px solid black;
      }
      td {
        padding: 0px;
        width: 85px;
        height: 30px;
        text-align: center;
        vertical-align: middle;
        font-size: 1.4em;
      }
      table td:empty {
        background-color: lightgray;
      }
      td input[type="radio"] {
        position: absolute;
        visibility: none;
        width: 0;
        height: 0;
      }
      td label {
        display: block;
        width: 100%;
        padding: 30px 0px;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }
      td label:hover {
        background-color: #007bff;
        color: white;
      }
      td input[type="radio"]:checked + label {
        background-color: #007bff;
        color: white;
        font-weight: bold;
      }
      /*Form styling*/
      form {
        display: block;
        gap: 20px;
        background-color: green;
      }
    </style>
  </head>
