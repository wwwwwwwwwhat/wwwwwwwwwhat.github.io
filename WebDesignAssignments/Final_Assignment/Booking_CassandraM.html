    <link rel="stylesheet" type="text/css" href="../CSS/final-stylesheet.css">
    <style>
      header {
        margin: 0px;
      }
      div.head {
        width: 100%;
        height: 200px;
        background-image: blue;
        margin: 0px;
      }
      div.fnav {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 2fr 1fr;
        gap: 0px;
        width: 100%;
        height: 300px;
        background-color: #aecbd9;
        margin: 0px;
      }
      div.fnav h1 {
        grid-column: 1;
        grid-row: span 2;
        margin: auto;
        font-size: 45px;
      }
      div.fnav div.links {
        grid-column: 2;
        grid-row: 1;
        display: flex;
        flex-direction: column;
        margin: auto;
      }
      div.fnav div.socials {
        grid-column: 2;
        grid-row: 2;
        display: flex;
        flex-direction: row;
        justify-content: center;
        gap: 25px;
      }
      div.socials img {
        width: 40px;
        height: 40px;
      }
      div.book {
        display: grid;
        width: auto;
        grid-template-columns: 1fr auto auto 1fr;
        column-gap: 0px;
        margin: 45px 0px;
      }
      /*Table styling*/
      table {
        /*--transform: scaleY(0.8) scaleX(0.8);*/
        grid-column: 2;
        display: block;
        width: contain;
        height: auto;
        background-color: white;
        padding: 0px;
        border-collapse: collapse;
        border-radius: 10px 0px 0px 10px;
      }
      td {
        padding: 0px;
        width: 85px;
        height: 25px;
        text-align: center;
        vertical-align: middle;
        font-size: 1.4em;
      }
      table td:empty {
        background-color: lightgray;
      }
      td input[type="radio"] {
        position: absolute;
        display:none;
      }
      td label {
        display: block;
        width: 100%;
        padding: 25px 0px;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }
      td label:hover {
        background-color: #66afff;
        color: white;
      }
      td input[type="radio"]:checked + label {
        background-color: #66afff;
        color: white;
        font-weight: bold;
      }
      th {
        height: 25px;
        border-bottom: 2px solid black;
      }
      /*Form styling*/
      form {
        grid-column: 3;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        width: 530px;
        height: 100%;
      }
      div.q {
        display: flex;
        justify-content: space-between;
        width: 80%;
        margin: 0px auto;
      }
      form select {
        width: 230px;
      }
      form input {
        width: 220px;
      }
      form textarea {
        width: 220px;
      }
      input[type="submit"] {
        display: none;
      }
      div.q:last-of-type {
        justify-content: center;
        align-items: center;
      }
      div.q:last-of-type label {
        display: block;
        width: 60%;
        height: 80px;
        border: 5px solid white;
        background-color: #66afff;
        color: white;
        text-align: center;
        vertical-align: center;
        cursor: pointer;
        transition: transform 0.3s ease;
        transform-origin: center;
      }
      div.q:last-of-type label:hover {
        transform: scaleY(1.2) scaleX(1.1);
      }
    </style>
  </head>
