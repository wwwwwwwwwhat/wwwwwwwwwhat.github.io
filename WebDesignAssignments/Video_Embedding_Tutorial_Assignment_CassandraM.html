<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Video Embedding Tutorial Assignment</title>
    <link rel="stylesheet" type="text/css" href="CSS/vid-embedding-stylesheet.css">
    <style>
      body {
        background-color: black;
      }
      h3, h4, p, img {
        display: inline-block;
      }
      div.top {
        position: relative;
        top: 10px;
        left: 40px;
        background-color: #e11339;
      }
      h3.top, p.top {
        color: white;
        font-size: 3em;
      }
      div.container {
        display: flex;
        background-color: #f2bfbf;
        width: 80%;
        margin: 0 auto;
      }
      div.step {
        background-color: white;
        width: 300px;
        height: 450px;
        margin: 20px;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <h3>How to Embed a Youtube Video</h3>
      <p>by Cassandra McCaughey</p>
    </div>
    <div class="container">
      <div class="step">
        <h4>Step 1</h4>
        <img src="" alt="">
        <p>Open YouTube and find the video you want to embed.</p>
      </div>
      <div class="step">
        <h4>Step 2</h4>
        <img src="" alt="">
        <p>Click the 'Share' button below the video.</p>
      </div>
      <div class="step">
        <h4>Step 3</h4>
        <img src="" alt="">
        <p></p>
      </div>
    </div>
  </body>
</html>
