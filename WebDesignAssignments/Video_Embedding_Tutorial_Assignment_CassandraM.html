<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Video Embedding Tutorial Assignment</title>
    <link rel="stylesheet" type="text/css" href="CSS/vid-embedding-stylesheet.css">
    <style>
      body {
        background-color: #e11339;
      }
      h3, h4, p, img {
        display: inline-block;
      }
      div.top {
        background-color:cyan;
        position: relative;
        width:100%;
        height: 200px;
        top: 10px;
        left: 40px;
      }
      h3:first-of-type {
        font-family: "Century Gothic", Futura, sans-serif;
        font-weight: bold;
        padding-left: 10px;
        color: white;
        font-size: 4em;
        width:600px;
      }
      p:first-of-type {
        width: 500px;
        color: white;
      }
      div.container {
        display: flex;
        text-wrap: wrap;
        background-color: #f88c8c;
        width: 80%;
        margin: 100px auto;
      }
      div.step {
        background-color: white;
        width: 300px;
        height: 300px;
        margin: 20px;
        justify-content: center;
      }
      h4, p {
        font-family: "Century Gothic", Futura, sans-serif;
        font-size: 1.5em;
        color: black;
      }
      img {
        width:200px;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <h3>How to Embed a Youtube Video</h3>
      <p>by Cassandra McCaughey</p>
    </div>
    <div class="container">
      <div class="step">
        <h4>Step 1</h4>
        <img src="Images/screenshot-1.png" alt="">
        <p>Open YouTube and find the video you want to embed</p>
      </div>
      <div class="step">
        <h4>Step 2</h4>
        <img src="Images/screenshot-2.png" alt="">
        <p>Click the 'Share' button below the video</p>
      </div>
      <div class="step">
        <h4>Step 3</h4>
        <img src="Images/screenshot-3.png" alt="">
        <p>Select "Embed"</p>
      </div>
      <div class="step">
        <h4>Step 4</h4>
        <img src="Images/screenshot-4.png" alt="">
        <p>Click copy in the bottom right corner, then paste it into your html file!</p>
      </div>
    </div>
  </body>
</html>
