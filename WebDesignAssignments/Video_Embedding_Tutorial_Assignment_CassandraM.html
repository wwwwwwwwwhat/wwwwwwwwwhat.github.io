<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Video Embedding Tutorial Assignment</title>
    <link rel="stylesheet" type="text/css" href="CSS/vid-embedding-stylesheet.css">
  </head>
  <body>
    <div class="top">
      <h3>How to Embed a Youtube Video</h3>
      <p>by Cassandra McCaughey</p>
    </div>
    <div class="container">
      <div class="step">
        <h4>Step 1</h4>
        <p>Open YouTube and find the video you want to embed</p>
        <img src="Images/screenshot-1.png" alt="">
      </div>
      <div class="step">
        <h4>Step 2</h4>
        <p>Click the 'Share' button below the video</p>
        <img src="Images/screenshot-2.png" alt="" class="tooshortimg">
      </div>
      <div class="step">
        <h4>Step 3</h4>
        <p>Select "Embed"</p>
        <img src="Images/screenshot-3.png" alt="">
      </div>
      <div class="step">
        <h4>Step 4</h4>
        <p>Click copy in the bottom right corner, then paste it into your html file!</p>
        <img src="Images/screenshot-4.png" alt="">
      </div>
      <div class="step">
        <h4>Done! --></h4>
      </div>
      <div>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/Vcy16ikee8w?si=V_TOBymm-x-l7BGn" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
    </div>
  </body>
</html>
