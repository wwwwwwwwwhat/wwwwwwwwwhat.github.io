<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Video Embedding Tutorial Assignment</title>
    <link rel="stylesheet" type="text/css" href="CSS/vid-embedding-stylesheet.css">
    <style>
      body {
        background-color: #e11339;
      }
      h3, h4, p, img {
        display: inline-block;
      }
      div.top {
        position: relative;
        width:100%;
        height: 200px;
        top: 10px;
        left: 40px;
      }
      div.top h3 {
        font-family: "Century Gothic", Futura, sans-serif;
        font-weight: bold;
        padding-left: 10px;
        color: white;
        font-size: 4em;
        width:600px;
      }
      div.top p {
        width: 500px;
        color: white;
        line-height: 200px;
      }
      div.container {
        display: flex;
        align-items: flex-start;
        flex-wrap: wrap;
        background-color: #f88c8c;
        width: 90%;
        margin: 100px auto;
      }
      div.step {
        background-color: white;
        width: 560px;
        height: 315px;
        margin: 20px;
        justify-content: center;
      }
      h4, p {
        font-family: "Century Gothic", Futura, sans-serif;
        font-size: 1.5em;
        color: black;
      }
      img {
        width:280px;
        right: 0px;
      }
      div.step h4 {
        position: relative;
        top: 0;
        left: 0;
      }
      div.step p {
      }
      iframe {
        margin: 20px;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <h3>How to Embed a Youtube Video</h3>
      <p>by Cassandra McCaughey</p>
    </div>
    <div class="container">
      <div class="step">
        <h4>Step 1</h4>
        <p>Open YouTube and find the video you want to embed</p>
        <img src="Images/screenshot-1.png" alt="">
      </div>
      <div class="step">
        <h4>Step 2</h4>
        <p>Click the 'Share' button below the video</p>
        <img src="Images/screenshot-2.png" alt="">
      </div>
      <div class="step">
        <h4>Step 3</h4>
        <p>Select "Embed"</p>
        <img src="Images/screenshot-3.png" alt="">
      </div>
      <div class="step">
        <h4>Step 4</h4>
        <p>Click copy in the bottom right corner, then paste it into your html file!</p>
        <img src="Images/screenshot-4.png" alt="">
      </div>
      <div>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/Vcy16ikee8w?si=V_TOBymm-x-l7BGn" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
    </div>
  </body>
</html>
