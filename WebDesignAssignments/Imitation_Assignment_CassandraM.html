<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Imitation Assignment</title>
    <style>
      div {
        width: 1500px;
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      img {
        margin: 30px;
      }
      img.butterfly {
        -webkit-filter: invert(100%) opacity(50%);
        filter: invert(100%) opacity(50%);
        border-radius: 100px 0px 100px 0px;
      }
      img.theater {
        -webkit-filter: blur(5px);
        filter: blur(5px);
      }
      img.dino {
        -webkit-filter: drop-shadow(5px 0px 5px black) hue-rotate(90deg);
        filter: drop-shadow(5px 0px 5px black) hue-rotate(90deg);
      }
      img.penguins {
        -webkit-filter: sepia(50%);
        filter: sepia(50%);
      }
      div.seagull {
        background-image: url(Images/ImitationImages/seagull.png), linear-gradient()
      }
      img.field {
        -webkit-filter: grayscale(100%);
        filter: grayscale(100%);
        border: 10px solid blue;
        border-image: url('Images/ImitationImages/tic-tac-toe.png') 10px round;
        
      }
    </style>
  </head>
  <body>
    <h4>Cassandra McCaughey/ Imitation Assignment</h4>
    <hr/>
    <br/>
    <div>
      <img src="Images/ImitationImages/butterfly.jpg" alt="" class="butterfly">
      <img src="Images/ImitationImages/theater_stage.jpg" alt="" class="theater">
      <img src="Images/ImitationImages/dinosaur.png" alt="" class="dino">
      <img src="Images/ImitationImages/penguins.jpg" alt="" class="penguins">
      <div class="seagull">
        <img src="Images/ImitationImages/seagull.png" alt="">
      </div>
      <img src="Images/ImitationImages/football_field.jpg" alt="" class="field">
    </div>
  </body>
</html>
