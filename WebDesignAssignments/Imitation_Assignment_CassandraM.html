<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Imitation Assignment</title>
    <style>
      div.flex {
        width: 1350px;
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      div {
        position: relative;
        margin:15px;
      }
      img {
        display:inline-block;
        margin:0px;
      }
      img.butterfly {
        -webkit-filter: invert(100%) opacity(75%);
        filter: invert(100%) opacity(75%);
        border-radius: 100px 0px 100px 0px;
      }
      div.theater {
        display: inline-block;
        width: 300px;
        height: 264px;
      }
      img.theater {
        position: absolute;
        width: 300px;
        height: 264px;
        -webkit-filter: blur(3px);
        filter: blur(3px);
        margin: 0px;
      }
      div.theater p {
        position: absolute;
        display: grid;
        width:300px;
        height: 264px;
        place-items: center;
        color: white;
        font-size: 30px;
        text-shadow: 3px 3px 1px black;
        margin:0px;
        z-index: 1;
      }
      img.dino {
        width: 60%;
        height: 60%;
        -webkit-filter: drop-shadow(20px 0px 5px black) hue-rotate(90deg);
        filter: drop-shadow(20px 0px 5px black) hue-rotate(90deg);
      }
      img.penguins {
        -webkit-filter: sepia(50%);
        filter: sepia(50%);
        border-radius: 450px 450px/ 300px 300px;
        border: 1px solid black;
      }
      div.seagull {
        background-image: url('Images/ImitationImages/seagull.png'), linear-gradient(to bottom right, cornflowerblue, white);
        background-size: 280px 198px;
        box-shadow: 0px 20px 5px gray;
        width: 280px;
        height: 198px;
      }
      img.field {
        -webkit-filter: grayscale(100%);
        filter: grayscale(100%);
        border: 50px solid blue;
        border-image: url('Images/ImitationImages/tic-tac-toe.png') 50 round;
      }
    </style>
  </head>
  <body>
    <h4>Cassandra McCaughey/ Imitation Assignment</h4>
    <hr/>
    <br/>
    <div class="flex">
      <img src="Images/ImitationImages/butterfly.jpg" alt="" class="butterfly">
      <div class="theater">
        <p>Presenting</p>
        <img src="Images/ImitationImages/theater_stage.jpg" alt="" class="theater">
      </div>
      <div>
        <img src="Images/ImitationImages/dinosaur.png" alt="" class="dino">
      </div>
      <div>
        <img src="Images/ImitationImages/penguins.jpg" alt="" class="penguins">
      </div>
      <div class="seagull"></div>
      <div>
        <img src="Images/ImitationImages/football_field.jpg" alt="" class="field">
      </div>
    </div>
  </body>
</html>
